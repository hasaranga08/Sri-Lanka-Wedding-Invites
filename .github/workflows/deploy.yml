name: Deploy Sri Lanka Wedding Invites to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:
    inputs:
      enable_custom_domain:
        description: 'Enable Custom Domain (srilankaweddinginvites.lk)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # In Stage 1 (default), base path automatically resolves to /${{ github.event.repository.name }}/
          # In Stage 2 (Custom Domain), setting ENABLE_CUSTOM_DOMAIN to true sets base path to /
          ENABLE_CUSTOM_DOMAIN: ${{ inputs.enable_custom_domain || vars.ENABLE_CUSTOM_DOMAIN || 'false' }}

      - name: Configure deployment domain mode & verify artifacts
        run: |
          CUSTOM_MODE="${{ inputs.enable_custom_domain || vars.ENABLE_CUSTOM_DOMAIN || 'false' }}"
          echo "=========================================================="
          echo "Deployment Mode: ENABLE_CUSTOM_DOMAIN = $CUSTOM_MODE"
          echo "=========================================================="
          
          if [ "$CUSTOM_MODE" = "true" ]; then
            echo "Stage 2 Active: Ensuring dist/CNAME is present for srilankaweddinginvites.lk..."
            test -f dist/CNAME || cp public/CNAME dist/CNAME
          else
            echo "Stage 1 Active: Temporary GitHub Pages mode."
            echo "Excluding dist/CNAME so GitHub Pages serves at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            rm -f dist/CNAME
          fi

          echo "Verifying generated HTML pages..."
          test -f dist/index.html || { echo "Error: dist/index.html missing"; exit 1; }
          test -f dist/roshini-hasaranga/index.html || { echo "Error: dist/roshini-hasaranga/index.html missing"; exit 1; }
          test -f dist/Roshini-Hasaranga/index.html || { echo "Error: dist/Roshini-Hasaranga/index.html missing"; exit 1; }
          test -f dist/404.html || { echo "Error: dist/404.html missing"; exit 1; }
          echo "All required HTML entry points verified successfully!"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
